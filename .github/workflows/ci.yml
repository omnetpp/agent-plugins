name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Manifests are up to date with plugins.json
        run: node scripts/gen-manifests.mjs --check
      - name: Skills follow the rules in AGENTS.md
        run: node scripts/check-skills.mjs
      - name: Claude Code validates the marketplace and the plugins
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.330
          claude plugin validate --strict .
          for p in plugins/*/; do claude plugin validate --strict "$p"; done

  # The latest agent CLIs, not pinned ones: the job is there to catch an agent changing how
  # it reads the plugins.
  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Claude Code, Codex and Copilot CLI
        run: npm install -g @anthropic-ai/claude-code @openai/codex @github/copilot
      - name: The agents install the plugins from this checkout
        run: node tests/agent-install-smoke.mjs --require

  # The launcher runs the tools from PATH or through npx, with platform-specific spawning
  # (npm's .cmd shims on Windows), so it is tested on every platform and both ways. The
  # steps are independent, so that a failure of one tool does not hide the others, and the
  # first step runs opp_lint without the launcher, to tell plugin bugs from opp-tools bugs.
  tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: opp_lint itself reports the broken fixture (directory and file mode)
        run: |
          pkg="@omnetpp/opp-tools@$(node -p "require('./plugins.json').oppTools.version")"
          for target in tests/project tests/project/broken.ned; do
            rc=0; npx --yes -p "$pkg" opp_lint "$target" || rc=$?
            echo "opp_lint $target: exit $rc"; [ "$rc" -eq 1 ]
          done
      - name: Lint hook through the launcher and npx
        if: ${{ !cancelled() }}
        run: node tests/hook-smoke.mjs
      - name: Language server and MCP server through the launcher and npx
        if: ${{ !cancelled() }}
        run: node tests/tools-smoke.mjs
      - name: Install opp-tools on PATH
        if: ${{ !cancelled() }}
        run: npm install -g "@omnetpp/opp-tools@$(node -p "require('./plugins.json').oppTools.version")"
      - name: Lint hook through the launcher and PATH
        if: ${{ !cancelled() }}
        run: node tests/hook-smoke.mjs
      - name: Language server and MCP server through the launcher and PATH
        if: ${{ !cancelled() }}
        run: node tests/tools-smoke.mjs
